
<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Todo List</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous"
    />

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
    />

</head>

<body>

    <div class="container-fluid" style="min-height: 100vh;">

        <!-- Header -->
        <div class="p-3 d-flex justify-content-between">
            <h1>Todo App</h1>

            <div>
                <a href="{% url 'add' %}" class="btn btn-success">
                    Add New +
                </a>
            </div>
        </div>

        <!-- Main -->
        <div>

            {% if data %}

            <table class="table table-dark">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Created At</th>
                        <th></th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>

                    {% for i in data %}

                    <tr>

                        <td>{{ i.id }}</td>

                        <td>{{ i.title }}</td>

                        <td>{{ i.description }}</td>

                        <td>{{ i.created_at }}</td>

                        <td class="d-flex gap-3">

                            {% if i.status == 'pending' %}

                            <!-- Edit Button -->
                            <a href="{% url 'edit' i.id %}" class="btn">
                                <i class="fa-solid fa-pen text-warning"></i>
                            </a>

                            <!-- Complete Button -->
                            <a href="{% url 'status' i.id %}" class="btn">
                                <i class="fa-solid fa-check text-success"></i>
                            </a>

                            {% else %}

                            <h4 class="text-primary">Completed</h4>

                            {% endif %}

                        </td>

                        <!-- Delete Button -->
                        <td>
                            <a href="{% url 'delete' i.id %}" class="btn">
                                <i class="fa-solid fa-trash text-danger"></i>
                            </a>
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

            {% else %}

            <h4 class="text-primary">No Todos Available</h4>

            {% endif %}

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous">
    </script>

</body>
</html>
